
services:
  db:
    image: postgres:17-alpine
    container_name: leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - leads-db:/var/lib/postgresql/data

volumes:
  leads-db:

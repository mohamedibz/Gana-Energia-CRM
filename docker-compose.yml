name: gana-energia-crm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads_db}
    # Publicado para el modo desarrollo (API con npm run start:dev en tu máquina)
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - leads-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend-leads-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leads}:${POSTGRES_PASSWORD:-leads_password}@db:5432/${POSTGRES_DB:-leads_db}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_cambiame_en_produccion_0123456789}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
      PAGINATION_MAX_LIMIT: ${PAGINATION_MAX_LIMIT:-100}
      PAGINATION_DEFAULT_LIMIT: ${PAGINATION_DEFAULT_LIMIT:-20}
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ./frontend-leads-app
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  leads-db:
